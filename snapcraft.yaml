name: librecad
version: '0.0.9'
grade: stable
# Core 26 is the current base supported by Snapcraft 9.  The prior core20
# base requires the now-legacy Snapcraft 8 track.
base: core26
platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]
confinement: devmode
summary: "librecad: is a 2D CAD"
description: |
  LibreCAD 3 is a next generation 2D CAD application written to be modular, with a core independent from GUI toolkits. Scripting is possible with Lua and Python.
source-code: https://github.com/LibreCAD/LibreCAD_3
contact:
  - https://forum.librecad.org/
issues: https://github.com/LibreCAD/LibreCAD_3/issues
environment:
  LD_LIBRARY_PATH: $SNAP/usr/local/lib:$SNAP/usr/lib/$CRAFT_ARCH_TRIPLET_BUILD_FOR:$SNAP/usr/lib64:$SNAP/usr/lib:$LD_LIBRARY_PATH

apps:
  librecad:
    command: usr/bin/librecad
    extensions:
      - gpu
    plugs:
      - desktop
      - desktop-legacy
      - home
      - opengl
      - wayland
      - x11
parts:
  librecad:
    plugin: cmake
    source: .
    after: [libdxfrw]
    build-packages:
      # Use the distribution's Qt 6 packages.  This keeps the build
      # self-contained and avoids the retired Qt5/KDE content snaps.
      - qt6-base-dev
      - qt6-tools-dev
      - qt6-tools-dev-tools
      - qt6-svg-dev
      - libqt6opengl6-dev
      # Phase 6 PR-6.4 — the stale liblua5.2-dev pin here has been out
      # of sync with the root CMakeLists' `find_package(Lua 5.3 EXACT
      # REQUIRED)` for years.  Fixed to 5.3.  Also added python3-dev
      # for the phase-5 Python scripting layer (WITH_PYTHONSCRIPT=ON).
      - liblua5.3-dev
      - python3-dev
      - git
      - g++
      - libcairo2-dev
      - libpango-1.0-0
      - libpango1.0-dev
      - libboost-dev
      - libboost-log-dev
      - libboost-program-options-dev
      - libqt5svg5-dev
      - libgtest-dev
      - libeigen3-dev
      - libcurl4-gnutls-dev
      - libgtk-3-dev
      - libglew-dev
      - rapidjson-dev
      - libbz2-dev
      - libglfw3-dev
      - libglm-dev
      - cmake
    stage-packages:
      # Bundle the Qt 6 runtime from the base archive rather than relying on
      # the KDE Neon content snap, which does not support core26.
      - qt6-base-dev
      - qt6-svg-dev
      - qt6-qpa-plugins
      - qt6-gtk-platformtheme
      - libboost-dev
      - libboost-log-dev
      - libboost-program-options-dev
      - libglew2.2
      # Phase 6 PR-6.4 — stage python3 so the packaged snap has a
      # runtime interpreter that lcadpythonscript's embedded pybind11
      # can link against.  Without this, the snap builds cleanly (the
      # build-packages libpython dev headers satisfy the build) but
      # the installed snap fails at runtime with "cannot find
      # libpython3.X.so".
      - python3
    cmake-parameters:
      - "-DCMAKE_INSTALL_PREFIX=/usr"
      - "-DBUILD_SHARED_LIBS=ON"
      - "-DWITH_BUNDLED_PYTHON_RUNTIME=ON"
    #For 18.04
    #configflags:
    #  - "-DCMAKE_INSTALL_PREFIX=/usr"
    #  - "-DBUILD_SHARED_LIBS=On"
  libdxfrw:
    plugin: cmake
    source: https://github.com/LibreCAD/libdxfrw.git
    source-type: git
    source-commit: f7debf4c5f30734a70c5e828cf05247aabc2d04b
    build-packages:
      - cmake
      - g++
      - git
      - libboost-dev
      - libbz2-dev
    override-build: |
      bash "$CRAFT_PROJECT_DIR/scripts/patch-libdxfrw.sh" "$CRAFT_PART_SRC"
      craftctl default
    cmake-parameters:
      - "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
      - "-DCMAKE_INSTALL_PREFIX=/usr"
      - "-DBUILD_SHARED_LIBS=ON"


    #For 18.04
    #configflags:
    #  - "-DBUILD_SHARED_LIBS=On"
