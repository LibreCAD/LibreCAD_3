name: librecad
version: '0.0.9'
grade: stable
base: core20
confinement: devmode
summary: "librecad: is a 2D CAD"
description: |
  LibreCAD 3 is a next generation 2D CAD application written to be modular, with a core independent from GUI toolkits. Scripting is possible with Lua and Python.
source-code: https://github.com/LibreCAD/LibreCAD_3
contact:
  - https://forum.librecad.org/
issues: https://github.com/LibreCAD/LibreCAD_3/issues
environment:
  LD_LIBRARY_PATH: $SNAP/usr/local/lib/:$SNAP/usr/lib/x86_64-linux-gnu/:$SNAP/usr/lib64/:$LD_LIBRARY_PATH

apps:
  librecad:
    command: usr/bin/librecad
    extensions:
      - kde-neon
parts:
  librecad:
    plugin: cmake
    build-snaps:
      - kde-frameworks-5-core18-sdk
      - kde-frameworks-5-core18
    source: .
    build-packages:
      - qttools5-dev
      - qttools5-dev-tools
      - libqt5opengl5-dev
      # Phase 6 PR-6.4 — the stale liblua5.2-dev pin here has been out
      # of sync with the root CMakeLists' `find_package(Lua 5.3 EXACT
      # REQUIRED)` for years.  Fixed to 5.3.  Also added python3-dev
      # for the phase-5 Python scripting layer (WITH_PYTHONSCRIPT=ON).
      - liblua5.3-dev
      - python3-dev
      - git
      - g++
      - libcairo2-dev
      - libpango-1.0-0
      - libpango1.0-dev
      - libboost-dev
      - libboost-log-dev
      - libboost-program-options-dev
      - libqt5svg5-dev
      - libgtest-dev
      - libeigen3-dev
      - libcurl4-gnutls-dev
      - libgtk-3-dev
      - libglew-dev
      - rapidjson-dev
      - libbz2-dev
      - libglfw3-dev
      - libglm-dev
      - cmake
    stage-packages:
      - libboost-dev
      - libboost-log-dev
      - libboost-program-options-dev
      - libglew2.2
      # Phase 6 PR-6.4 — stage python3 so the packaged snap has a
      # runtime interpreter that lcadpythonscript's embedded pybind11
      # can link against.  Without this, the snap builds cleanly (the
      # build-packages libpython dev headers satisfy the build) but
      # the installed snap fails at runtime with "cannot find
      # libpython3.X.so".
      - python3
    cmake-parameters:
      - "-DCMAKE_INSTALL_PREFIX=/usr"
      - "-DBUILD_SHARED_LIBS=ON"
    #For 18.04
    #configflags:
    #  - "-DCMAKE_INSTALL_PREFIX=/usr"
    #  - "-DBUILD_SHARED_LIBS=On"
  libdxfrw:
    plugin: cmake
    source: persistence/libdxfrw
    cmake-parameters:
      - "-DBUILD_SHARED_LIBS=ON"


    #For 18.04
    #configflags:
    #  - "-DBUILD_SHARED_LIBS=On"

