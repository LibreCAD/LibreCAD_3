name: librecad
version: '0.0.9'
grade: stable
# Core 26 is the current base supported by Snapcraft 9.  The prior core20
# base requires the now-legacy Snapcraft 8 track.
base: core26
confinement: devmode
summary: "librecad: is a 2D CAD"
description: |
  LibreCAD 3 is a next generation 2D CAD application written to be modular, with a core independent from GUI toolkits. Scripting is possible with Lua and Python.
source-code: https://github.com/LibreCAD/LibreCAD_3
contact:
  - https://forum.librecad.org/
issues: https://github.com/LibreCAD/LibreCAD_3/issues
environment:
  LD_LIBRARY_PATH: $SNAP/usr/local/lib/:$SNAP/usr/lib/x86_64-linux-gnu/:$SNAP/usr/lib64/:$LD_LIBRARY_PATH

apps:
  librecad:
    command: usr/bin/librecad
    extensions:
      - gpu
    plugs:
      - desktop
      - desktop-legacy
      - home
      - opengl
      - wayland
      - x11
parts:
  librecad:
    plugin: cmake
    source: .
    build-packages:
      # Use the distribution's Qt 6 packages.  This keeps the build
      # self-contained and avoids the retired Qt5/KDE content snaps.
      - qt6-base-dev
      - qt6-tools-dev
      - qt6-tools-dev-tools
      - qt6-svg-dev
      # Phase 6 PR-6.4 — the stale liblua5.2-dev pin here has been out
      # of sync with the root CMakeLists' `find_package(Lua 5.3 EXACT
      # REQUIRED)` for years.  Fixed to 5.3.  Also added python3-dev
      # for the phase-5 Python scripting layer (WITH_PYTHONSCRIPT=ON).
      - liblua5.3-dev
      - python3-dev
      - git
      - g++
      - libcairo2-dev
      - libpango-1.0-0
      - libpango1.0-dev
      - libboost-dev
      - libboost-log-dev
      - libboost-program-options-dev
      - libgtest-dev
      - libeigen3-dev
      - libcurl4-gnutls-dev
      - libgtk-3-dev
      - libglew-dev
      - rapidjson-dev
      - libbz2-dev
      - libglfw3-dev
      - libglm-dev
      - cmake
    stage-packages:
      # Runtime packages, not the -dev ones that were here before. These are
      # exactly the packages that own the libraries linuxdeploy copies into the
      # AppImage when it walks this binary's dependencies, which is the only
      # list that is known to be complete -- the snap's own missing-library
      # lint never ran, because the pack died before staging.
      #
      # Under devmode the process still runs in the snap's own mount namespace,
      # so a library named here and nowhere else is simply absent: the snap
      # installs and then will not start, and no build step catches it.
      #
      # The versioned names track core26's contents. They are fixed for the
      # life of the base; a base bump has to revisit them.
      - libqt6core6t64
      - libqt6gui6
      - libqt6widgets6
      - libqt6opengl6
      - libqt6openglwidgets6
      - libqt6svg6
      - libqt6uitools6
      - libqt6dbus6
      - qt6-qpa-plugins
      - qt6-svg-plugins
      - qt6-gtk-platformtheme
      # The app plugs wayland; without this only the xcb platform plugin is
      # deployed, so a Wayland session falls back to XWayland silently.
      - qt6-wayland
      - liblua5.3-0
      - libglew2.2
      - libboost-log1.90.0
      - libboost-filesystem1.90.0
      - libboost-thread1.90.0
      - libboost-program-options1.90.0
      # lcadpythonscript's embedded interpreter links libpython and needs a
      # standard library to start at all.
      - python3
      - libpython3.14
    cmake-parameters:
      - "-DCMAKE_INSTALL_PREFIX=/usr"
      - "-DBUILD_SHARED_LIBS=ON"
      # Point the Python lookup at the host, where python3-dev put the
      # headers. Without this the build fails at
      #
      #   CMake Error: Could NOT find Python
      #     (missing: Python_INCLUDE_DIRS Development.Embed)
      #     (found suitable version "3.14.4", minimum required is "3.9")
      #
      # which reads as "no Python" and is the opposite: there are two. The
      # staged python3 lands in the part's install prefix, which is on
      # CMAKE_PREFIX_PATH, so FindPython finds that interpreter first and then
      # looks for Python.h beside it -- and stage-packages are a runtime set,
      # so there are no headers there. python3-dev is a build-package and sits
      # in /usr. Naming the interpreter anchors the whole search on the prefix
      # that has both halves.
      - "-DPython_EXECUTABLE=/usr/bin/python3"
      - "-DPython_FIND_STRATEGY=LOCATION"
    #For 18.04
    #configflags:
    #  - "-DCMAKE_INSTALL_PREFIX=/usr"
    #  - "-DBUILD_SHARED_LIBS=On"
