name: Librecad3 Builders
'on':
  workflow_dispatch: null
  push:
    branches:
      - main
      - master
      - ci_dev
  pull_request:
    branches:
      - main
      - master

jobs:
  linux:
    name: BuildLinux
    # core26 must be crafted in an Ubuntu 26.04 environment.  Using the
    # matching hosted runner avoids LXD downloading a nested base image.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Test embedded Python provider guard
        run: python3 -m unittest scripts.tests.test_validate_python_provider -v

      # Cheap and first: a libdxfrw type in a public persistence header forces
      # every consumer of persistence to find libdxfrw's include path, and the
      # error message points nowhere near the edit.
      - run: ${{ github.workspace }}/scripts/ci/check-persistence-headers.sh

      # And that no read callback can take the process down with it.
      - run: ${{ github.workspace }}/scripts/ci/check-read-callbacks.sh

      - run: ${{ github.workspace }}/scripts/ubuntu-install/installDependenciesAndBuildRepo.sh

      - name: Verify selected Linux Python runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          test -s build/python-runtime-inventory.txt
          cat build/python-runtime-inventory.txt

      - run: cd ${{ github.workspace }}

      - run: sudo ${{ github.workspace }}/scripts/ubuntu-install/createAppImage.sh

      - name: Smoke final AppImage Python runtime
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find build -maxdepth 1 -type f -name 'LibreCAD*.AppImage' -print -quit)"
          test -n "$appimage"
          appimage="$(realpath "$appimage")"
          cd /tmp
          # The AppImage ships the xcb platform plugin; exercise it under a
          # virtual X server rather than requesting an unbundled offscreen plugin.
          xvfb-run -a env QT_QPA_PLATFORM=xcb \
            PYTHONHOME=/__librecad_python_poison__ \
            PYTHONPATH=/__librecad_python_poison__ \
            LIBRECAD_REQUIRE_BUNDLED_PYTHON=1 \
            LIBRECAD_REQUIRE_PYTHON_EXTENSION_CLOSURE=1 \
            "$appimage" --python-smoke

      - name: Smoke AppImage without host Python
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find build -maxdepth 1 -type f -name 'LibreCAD*.AppImage' -print -quit)"
          test -n "$appimage"
          appimage="$(realpath "$appimage")"
          docker pull --platform linux/amd64 ubuntu:26.04
          runtime_base=$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:26.04)
          docker build --platform linux/amd64 --build-arg "RUNTIME_BASE=$runtime_base" \
            -f scripts/ubuntu-install/appimage-runtime.Dockerfile \
            -t librecad-appimage-runtime scripts/ubuntu-install
          {
            docker image inspect --format '{{.Id}} {{.Architecture}}' librecad-appimage-runtime
            echo "base=$runtime_base"
          } | tee build/appimage-runtime-container.txt
          docker run --rm --platform linux/amd64 --network none --read-only \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,exec,nosuid,size=1g \
            -v "$appimage:/artifact/LibreCAD.AppImage:ro" \
            librecad-appimage-runtime /artifact/LibreCAD.AppImage \
            2>&1 | tee build/appimage-clean-runtime.log

      - name: Install or refresh Snapcraft (latest/stable)
        shell: bash
        run: |
          set -euo pipefail
          if sudo snap list snapcraft >/dev/null 2>&1; then
            sudo snap refresh snapcraft --channel=latest/stable
          else
            sudo snap install snapcraft --classic --channel=latest/stable
          fi
          snapcraft --version

      - run: cd ${{ github.workspace }}

      - run: ${{ github.workspace }}/scripts/ubuntu-install/createSnap.sh

      - name: Smoke installed snap Python runtime
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp
          xvfb-run -a env QT_QPA_PLATFORM=xcb \
            PYTHONHOME=/__librecad_python_poison__ \
            PYTHONPATH=/__librecad_python_poison__ \
            LIBRECAD_REQUIRE_BUNDLED_PYTHON=1 \
            snap run librecad --python-smoke

      # if: always(): a later, unrelated createSnap.sh failure was otherwise
      # skipping this upload of an AppImage that had already built fine.
      - name: Uploading AppImage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assets
          path: |
            ${{ github.workspace }}/build/LibreCAD**AppImage
            ${{ github.workspace }}/build/python-runtime-inventory.txt
            ${{ github.workspace }}/build/appimage-runtime-container.txt
            ${{ github.workspace }}/build/appimage-clean-runtime.log
          if-no-files-found: error
          retention-days: 2

      - name: Uploading snap
        uses: actions/upload-artifact@v4
        if: always()
        with:
          path: ${{ github.workspace }}/librecad**snap
          name: LibreCAD3.snap
          retention-days: 2

  # Exercise the system install and the same blocking Python/UI/DXF/Lua tests
  # on a native ARM64 GitHub-hosted runner. AppImage and Snap packaging stay in
  # the x64 job because the current deploy tools and snap target are x86_64/amd64.
  linux-arm64:
    name: BuildLinuxArm64
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Verify native runner architecture
        run: |
          test "$(uname -m)" = aarch64
          test "$(dpkg --print-architecture)" = arm64

      - name: Test embedded Python provider guard
        run: python3 -m unittest scripts.tests.test_validate_python_provider -v

      - name: Check persistence public headers
        run: ${{ github.workspace }}/scripts/ci/check-persistence-headers.sh

      - name: Check persistence read callbacks
        run: ${{ github.workspace }}/scripts/ci/check-read-callbacks.sh

      - name: Build, test, install, and smoke Linux ARM64
        env:
          # Keep native ARM64 objects separate from the x86_64 Linux job's
          # default build/ directory when both build trees are reused locally.
          LIBRECAD_BUILD_DIR: build-linux-arm64
        run: ${{ github.workspace }}/scripts/ubuntu-install/installDependenciesAndBuildRepo.sh

      - name: Verify ARM64 Python runtime inventory
        if: success()
        run: test -s build-linux-arm64/python-runtime-inventory.txt

      - name: Upload ARM64 Python runtime inventory
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-runtime-inventory-linux-arm64
          path: build-linux-arm64/python-runtime-inventory.txt
          if-no-files-found: ignore

  windows:
    name: BuildWindows
    # Keep the Conan ABI aligned with its prebuilt MSVC 2022 packages and the
    # Qt 6.8.3 win64_msvc2022_64 binaries installed below.
    runs-on: windows-2022
    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up CPython SDK
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: 'x64'

      - name: Pin the selected CPython for CMake
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:pythonLocation)) {
            throw 'setup-python did not provide pythonLocation'
          }
          $pythonExe = Join-Path $env:pythonLocation 'python.exe'
          if (-not (Test-Path $pythonExe)) {
            throw "Selected CPython executable not found: $pythonExe"
          }
          & $pythonExe -c 'import sys; print(sys.version)'
          "Python_ROOT_DIR=$env:pythonLocation" | Out-File -FilePath $env:GITHUB_ENV -Append
          "Python_EXECUTABLE=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test embedded Python provider guard
        shell: pwsh
        run: '& $env:Python_EXECUTABLE -m unittest scripts.tests.test_validate_python_provider -v'

      - run: cd ${{ github.workspace }}

      - run: ${{ github.workspace }}/scripts/windows-install/installConan.bat

      - run: ${{ github.workspace }}/scripts/windows-install/createConanDirAndInstallDependencies.bat

      - run: cd ${{ github.workspace }}/..

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          # Qt 6.8+ publishes Windows desktop binaries against MSVC 2022.
          # QtSvg and QtTools are in essentials and are not aqt add-on modules.
          arch: win64_msvc2022_64

      - name: Configure Qt 6
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:QT_ROOT_DIR)) {
            throw 'install-qt-action did not provide QT_ROOT_DIR'
          }
          "QTDIR=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
          "QT_QPA_PLATFORM_PLUGIN_PATH=$env:QT_ROOT_DIR\plugins\platforms" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$env:QT_ROOT_DIR\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - run: cd ${{ github.workspace }}

      # buildLibrecadAndCreatePackage.bat's final step is `cpack -G NSIS`,
      # which needs makensis.exe on PATH. Nothing installed NSIS before —
      # this had simply never been reached, since every earlier Windows CI
      # run failed at compile time long before packaging.
      - name: Install NSIS
        run: choco install nsis -y

      - name: Build and package LibreCAD on Windows
        shell: cmd
        run: call "${{ github.workspace }}\scripts\windows-install\buildLibrecadAndCreatePackage.bat"

      - name: Verify selected Python runtime inventory
        shell: pwsh
        run: |
          & $env:Python_EXECUTABLE scripts/validate_python_inventory.py `
            --inventory build/python-runtime-inventory.txt `
            --expected-root "$env:pythonLocation"
          if ($LASTEXITCODE -ne 0) {
            throw 'Selected CPython runtime inventory validation failed'
          }

      - run: cd ${{ github.workspace }}

      - name: Rename installer
        run: |
          shopt -s nullglob
          installers=(build/bin/LibreCAD3*.exe)
          test "${#installers[@]}" -eq 1
          version="$(git describe --always)"
          mv "${installers[0]}" "build/bin/LibreCAD3-${version}.exe"
        shell: bash

      - name: Install and smoke the isolated Python runtime
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'build/bin/LibreCAD3-*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Packaged NSIS installer not found' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'LibreCAD Python smoke Ω'
          # NSIS requires /D to be the last option and forbids quotes, even
          # when the installation path contains spaces.
          $installArgs = @('/S', "/D=$installRoot")
          $installProcess = Start-Process -FilePath $installer.FullName -ArgumentList $installArgs -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) {
            throw "NSIS installer exited with $($installProcess.ExitCode)"
          }
          $app = Join-Path $installRoot 'bin/librecad.exe'
          if (-not (Test-Path $app)) { throw "Installed executable not found: $app" }
          $env:PYTHONHOME = Join-Path $env:RUNNER_TEMP 'poison-python-home'
          $env:PYTHONPATH = Join-Path $env:RUNNER_TEMP 'poison-python-path'
          $env:LIBRECAD_REQUIRE_BUNDLED_PYTHON = '1'
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QTDIR -ErrorAction SilentlyContinue
          # This is a fresh hosted step, so the offscreen selection from the
          # build-tree batch file does not carry over. The package stages this
          # plugin explicitly; select it for a display-independent install smoke.
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Push-Location (Split-Path $app)
          & $app --python-smoke
          $smokeExitCode = $LASTEXITCODE
          Pop-Location
          if ($smokeExitCode -ne 0) { throw "Installed Python smoke exited with $smokeExitCode" }

      - name: Uploading exe
        uses: actions/upload-artifact@v4
        with:
          path: |
            ${{ github.workspace }}/build/bin/LibreCAD3**.exe
            ${{ github.workspace }}/build/python-runtime-inventory.txt
          name: assets
          if-no-files-found: error

  # DWG reading is off by default, so nothing else in CI exercises it. This job
  # turns it on and reads libdxfrw's own DWG fixtures under AddressSanitizer and
  # UndefinedBehaviorSanitizer.
  #
  # A DWG is a container of self-describing offsets and lengths, and the reader
  # walks them; the failure mode of a corrupt one is a bad read, not a wrong
  # number, which is exactly what a sanitizer sees and a test does not. Locally
  # the same sweep over the eight fixtures plus a 48-file mutation corpus
  # (bit flips and truncations of a libdxfrw-written base) reports zero
  # findings and zero abnormal exits; the mutants are not committed here --
  # they belong upstream, with the reader.
  dwg-sanitizers:
    name: ReadDwgUnderSanitizers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Modelled on the CodeQL job's list, which is known to configure and
          # build this tree. lcviewernoqt is added unconditionally, so its
          # dependencies are required even with the UI, Lua and Python off.
          sudo apt-get install -y cmake ninja-build libboost-all-dev libeigen3-dev \
            rapidjson-dev libgtest-dev libglew-dev libglfw3-dev liblua5.4-dev \
            libfreetype-dev libpng-dev libbz2-dev libglm-dev \
            libcurl4-gnutls-dev libgtk-3-dev freeglut3-dev

      # -Wno-error because the third-party submodules are built with -Werror and
      # warn under the sanitizers' instrumentation; their warnings are not what
      # this job is looking for.
      - name: Configure with DWG import and the sanitizers
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DWITH_DWG_IMPORT=ON -DWITH_QT_UI=OFF -DWITH_PYTHONSCRIPT=OFF \
            -DWITH_LUACMDINTERFACE=OFF -DWITH_RENDERING_UNITTESTS=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -Wno-error" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -Wno-error" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build the tests
        run: cmake --build build-asan --target lcunittest

      # halt_on_error: a sanitizer finding must fail the job, not be logged and
      # walked past.
      - name: Read the DWG fixtures
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build-asan/bin/lcunittest --gtest_filter='DwgImportTest.*'

  # BuildWindows has to install Qt, build every target and package an
  # installer before it tells us anything, and it has not reached a build in a
  # long time. This job answers the one question that gates the libdxfrw
  # submodule on Windows -- does MSVC compile the library and the persistence
  # layer that consumes it -- in a couple of minutes, without Qt, and fails the
  # PR on its own if it cannot.
  windows-persistence:
    name: BuildWindowsPersistence
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - run: ${{ github.workspace }}/scripts/windows-install/installConan.bat

      - run: ${{ github.workspace }}/scripts/windows-install/createConanDirAndInstallDependencies.bat

      # No -G: the batch files deliberately let CMake pick the newest Visual
      # Studio on the runner, and this job must exercise the same generator,
      # because Release there enables whole-program optimisation -- which is
      # what libdxfrw's /GL- and /Zc:inline- exist to counteract.
      - name: Configure without the Qt UI
        shell: cmd
        run: |
          cmake -S %CD% -B %CD%\build-persistence ^
            -DCMAKE_TOOLCHAIN_FILE="%CD%\conan\conan_toolchain.cmake" ^
            -DWITH_QT_UI=OFF -DWITH_UNITTESTS=OFF -DWITH_LUACMDINTERFACE=OFF ^
            -DWITH_PYTHONSCRIPT=OFF -DWITH_RENDERING_UNITTESTS=OFF
          if errorlevel 1 exit /b 1

      - name: Build libdxfrw and persistence
        shell: cmd
        run: |
          cmake --build %CD%\build-persistence --config Release --target dxfrw persistence
          if errorlevel 1 exit /b 1

  UpdateAssets:
    # Publishing the "Continuous Build" release belongs to pushes on the
    # default branch, not to pull-request validation. A pull_request run gets a
    # read-only GITHUB_TOKEN, so moving the `latest` tag fails:
    #
    #   Could not create new tag "refs/tags/latest"
    #   (Resource not accessible by integration)
    #   ##[error]Resource not accessible by integration
    #
    # Nobody saw this because the job `needs: [linux, windows]` and the linux
    # job had been failing at createSnap.sh, so it was skipped on every run.
    # With that fixed it runs on every PR and fails for a reason that has
    # nothing to do with the PR -- turning an otherwise green branch red.
    #
    # workflow_dispatch is kept: it is maintainer-initiated and its token can
    # write, so a manual refresh of the continuous build still works.
    if: >-
      github.repository_owner == 'LibreCAD'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch artifacts
        uses: actions/download-artifact@v4

      - name: Upload latest pre-release
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "latest"
          title: "Continuous Build"
          files: |
            assets/LibreCAD*.*
            LICENSE
