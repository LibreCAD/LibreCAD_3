name: Python binding macOS
'on':
  workflow_dispatch: null
  push:
    branches:
      - main
      - master
      - ci_dev
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  macos:
    name: Python / Lua / app bundle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install cmake boost eigen freetype glew glfw glm googletest lua@5.4 rapidjson qt python@3.14
          qt_root="$(brew --prefix qt)"
          lua_root="$(brew --prefix lua@5.4)"
          python_root="$(brew --prefix python@3.14)"
          {
            echo "QT_ROOT_DIR=$qt_root"
            echo "BREW_PREFIX=$(brew --prefix)"
            echo "LUA_INCLUDE_DIR=$lua_root/include/lua5.4"
            echo "LUA_LIBRARY=$lua_root/lib/liblua.dylib"
            echo "PYTHON_ROOT_DIR=$python_root"
            echo "PYTHON_EXECUTABLE=$python_root/bin/python3.14"
          } >> "$GITHUB_ENV"
          {
            echo "$qt_root/bin"
            echo "$python_root/bin"
          } >> "$GITHUB_PATH"

      - name: Test embedded Python provider guard
        shell: bash
        run: |
          "$PYTHON_EXECUTABLE" -m unittest scripts.tests.test_validate_python_provider -v

      - name: Configure Python-enabled LibreCAD
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/LibreCAD install Ω" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR;$BREW_PREFIX" \
            -DPython_ROOT_DIR="$PYTHON_ROOT_DIR" \
            -DPython_EXECUTABLE="$PYTHON_EXECUTABLE" \
            -DLUA_INCLUDE_DIR="$LUA_INCLUDE_DIR" \
            -DLUA_LIBRARY="$LUA_LIBRARY" \
            -DLIBRECAD_RECORD_NATIVE_ORIGINS=ON \
            -DLIBRECAD_NATIVE_ORIGIN_PROJECT_REVISION="$(git rev-parse HEAD)" \
            -DWITH_PYTHONSCRIPT=ON \
            -DWITH_PERSISTENCE=ON \
            -DWITH_UNITTESTS=ON \
            -DWITH_RENDERING_UNITTESTS=OFF

      - name: Build application and tests
        run: cmake --build build --target tinyspline librecad lcunittest --parallel 3

      - name: Require Python binding regression suites
        shell: bash
        run: |
          set -euo pipefail
          test_binary="$GITHUB_WORKSPACE/build/bin/lcunittest"
          required_suites=(
            'PythonFixture.'
            'PythonRuntime.'
            'ParityTest.'
            'ScriptValueRoundTrip.'
            'ScriptCallbackInvoke.'
            'ScriptCallbackEquality.'
            'ScriptCallbackLifecycle.'
            'ScriptObject.'
            'EventBus.'
            'LuaCustomEntityManager.'
            'ScriptCustomEntity.'
            'ScriptCustomEntityBuilder.'
            'CustomEntityDxfRoundTrip.'
            'ScriptCustomEntityLuaRegistration.'
            'DwgImportTest.'
            'PersistenceTest.'
            'ScriptDockTest.'
            'MWindowTest.'
            'ToolbarButtonTest.'
            'PyGuiBridgeTest.'
            'MenuEntriesTest.'
          )
          required_suite_args=()
          for suite in "${required_suites[@]}"; do
            required_suite_args+=(--require-suite "$suite")
          done
          QT_QPA_PLATFORM=offscreen "$PYTHON_EXECUTABLE" scripts/run_required_gtests.py \
            --binary "$test_binary" \
            --filter='PythonFixture.*:PythonRuntime.*:ParityTest.*:ScriptValueRoundTrip.*:ScriptCallbackInvoke.*:ScriptCallbackEquality.*:ScriptCallbackLifecycle.*:ScriptObject.*:EventBus.*:LuaCustomEntityManager.*:ScriptCustomEntity.*:ScriptCustomEntityBuilder.*:CustomEntityDxfRoundTrip.*:ScriptCustomEntityLuaRegistration.*:DwgImportTest.*:PersistenceTest.*:ScriptDockTest.*:MWindowTest.*:ToolbarButtonTest.*:PyGuiBridgeTest.*:MenuEntriesTest.*' \
            "${required_suite_args[@]}" 2>&1 | tee build/python-required-tests.log
          QT_QPA_PLATFORM=offscreen "$PYTHON_EXECUTABLE" scripts/run_required_gtests.py \
            --binary "$test_binary" \
            --filter='LuaRuntimeTest.*' \
            --require-suite 'LuaRuntimeTest.' 2>&1 | tee build/lua-required-tests.log

      - name: Install LibreCAD
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build 2>&1 | tee build/macos-install.log
          poison=/__librecad_python_environment_must_not_be_used__
          cd "$RUNNER_TEMP"
          env QT_QPA_PLATFORM=offscreen \
            PYTHONHOME="$poison" PYTHONPATH="$poison" \
            QT_PLUGIN_PATH="$poison" DYLD_LIBRARY_PATH="$poison" \
            LIBRECAD_REQUIRE_BUNDLED_PYTHON=1 \
            LIBRECAD_SETTINGS_DIR="$RUNNER_TEMP/LibreCAD installed settings Ω" \
            "$RUNNER_TEMP/LibreCAD install Ω/bin/librecad" --python-smoke \
            2>&1 | tee "$GITHUB_WORKSPACE/build/macos-installed-smoke.log"

      - name: Create and smoke the relocated app bundle
        shell: bash
        run: |
          set -euo pipefail
          install_prefix="$RUNNER_TEMP/LibreCAD install Ω"
          app="$RUNNER_TEMP/LibreCAD.app"
          relocated_app="$RUNNER_TEMP/LibreCAD relocated Ω.app"
          settings="$RUNNER_TEMP/LibreCAD settings Ω"
          scripts/macos-install/createBundle.sh "$install_prefix" "$app" 2>&1 | tee build/macos-bundle.log
          "$PYTHON_EXECUTABLE" -B "$app/Contents/Resources/librecad/lcUIPy/_nativeorigins.py" \
            "$app/Contents" "$app.native-origins.json" 2>&1 | tee build/macos-native-origins.log
          poison=/__librecad_python_environment_must_not_be_used__
          env QT_QPA_PLATFORM=offscreen \
            PYTHONHOME="$poison" \
            PYTHONPATH="$poison" \
            QT_PLUGIN_PATH="$poison" \
            DYLD_LIBRARY_PATH="$poison" \
            LIBRECAD_REQUIRE_BUNDLED_PYTHON=1 \
            LIBRECAD_SETTINGS_DIR="$settings" \
            "$app/Contents/MacOS/librecad" --python-smoke 2>&1 | tee build/macos-smoke.log
          ditto "$app" "$relocated_app"
          test ! -e "$relocated_app.native-origins.json"
          ditto "$app.native-origins.json" "$relocated_app.native-origins.json"
          codesign --verify --deep --strict "$relocated_app"
          "$PYTHON_EXECUTABLE" -B "$relocated_app/Contents/Resources/librecad/lcUIPy/_nativeorigins.py" \
            "$relocated_app/Contents" "$relocated_app.native-origins.json" \
            2>&1 | tee -a build/macos-native-origins.log
          env QT_QPA_PLATFORM=offscreen \
            PYTHONHOME="$poison" \
            PYTHONPATH="$poison" \
            QT_PLUGIN_PATH="$poison" \
            DYLD_LIBRARY_PATH="$poison" \
            LIBRECAD_REQUIRE_BUNDLED_PYTHON=1 \
            LIBRECAD_SETTINGS_DIR="$settings" \
            "$relocated_app/Contents/MacOS/librecad" --python-smoke 2>&1 | tee build/macos-relocated-smoke.log

      - name: Archive the verified app and runtime identity
        shell: bash
        run: |
          set -euo pipefail
          test -s build/python-runtime-inventory.txt
          app="$RUNNER_TEMP/LibreCAD.app"
          codesign --verify --deep --strict "$app"
          archive="$RUNNER_TEMP/LibreCAD-macos-${{ matrix.arch }}.tar.gz"
          tar -czf "$archive" -C "$RUNNER_TEMP" LibreCAD.app LibreCAD.app.native-origins.json
          extracted="$RUNNER_TEMP/LibreCAD archive smoke Ω"
          mkdir "$extracted"
          tar -xzf "$archive" -C "$extracted"
          codesign --verify --deep --strict "$extracted/LibreCAD.app"
          "$PYTHON_EXECUTABLE" -B "$extracted/LibreCAD.app/Contents/Resources/librecad/lcUIPy/_nativeorigins.py" \
            "$extracted/LibreCAD.app/Contents" "$extracted/LibreCAD.app.native-origins.json" \
            2>&1 | tee -a build/macos-native-origins.log
          poison=/__librecad_python_environment_must_not_be_used__
          env QT_QPA_PLATFORM=offscreen \
            PYTHONHOME="$poison" PYTHONPATH="$poison" \
            QT_PLUGIN_PATH="$poison" DYLD_LIBRARY_PATH="$poison" \
            LIBRECAD_REQUIRE_BUNDLED_PYTHON=1 \
            LIBRECAD_SETTINGS_DIR="$RUNNER_TEMP/LibreCAD archive settings Ω" \
            "$extracted/LibreCAD.app/Contents/MacOS/librecad" --python-smoke \
            2>&1 | tee build/macos-archive-smoke.log
          minimum_macos=$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")
          {
            echo "revision=$(git rev-parse HEAD)"
            echo "architecture=${{ matrix.arch }}"
            echo "minimum_macos=$minimum_macos"
            file "$app/Contents/MacOS/librecad"
            shasum -a 256 "$archive"
            codesign -dv --verbose=2 "$app" 2>&1
          } > build/macos-artifact-identity.txt
          "$PYTHON_EXECUTABLE" -B scripts/record_python_artifact.py \
            --artifact "$archive" --inventory build/python-runtime-inventory.txt \
            --platform macos-${{ matrix.arch }} --revision "$(git rev-parse HEAD)" \
            --evidence build/macos-artifact-identity.txt \
            --evidence build/macos-archive-smoke.log \
            --evidence build/macos-installed-smoke.log \
            --evidence build/macos-smoke.log \
            --evidence build/macos-relocated-smoke.log \
            --evidence build/python-required-tests.log \
            --evidence build/lua-required-tests.log \
            --evidence build/macos-native-origins.log \
            --output build/macos-artifact-identity.json
          cp build/macos-artifact-identity.json "$RUNNER_TEMP/LibreCAD-macos-${{ matrix.arch }}.identity.json"

      - name: Upload the verified app
        uses: actions/upload-artifact@v4
        with:
          name: LibreCAD-macos-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/LibreCAD-macos-${{ matrix.arch }}.tar.gz
            ${{ runner.temp }}/LibreCAD-macos-${{ matrix.arch }}.identity.json
          if-no-files-found: error

      - name: Upload runtime and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Python-macos-evidence-${{ matrix.arch }}
          path: |
            build/python-runtime-inventory.txt
            build/*-tests.log
            build/macos-*.log
            build/macos-artifact-identity.txt
            build/macos-artifact-identity.json
          if-no-files-found: error
