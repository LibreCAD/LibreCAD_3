            doxygen/doc/persistence/persistence.tag=../../persistence/html \
            doxygen/doc/lcviewernoqt/lcviewernoqt.tag=../../lcviewernoqt/html \
            doxygen/doc/luacmdinterface/luacmdinterface.tag=../../luacmdinterface/html \
            doxygen/doc/lcUI/lcUI.tag=../../lcUI/html \
            doxygen/doc/unittest/unittest.tag=../../unittest/html \
            doxygen/doc/lcadluascript/lcadluascript.tag=../../lcadluascript/html \
            doxygen/doc/lcadpythonscript/lcadpythonscript.tag=../../lcadpythonscript/html \
            doxygen/doc/lcscripting/lcscripting.tag=../../lcscripting/html
